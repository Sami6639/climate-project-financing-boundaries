name: Verify climate-finance submission extension

on:
  push:
    branches:
      - revision/financial-feasibility-2026-10-26
  pull_request:
    branches:
      - main

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r interval-extension/requirements-lock-linux-cp312.txt
      - name: Validate historical snapshot
        run: python verify_manifest.py
      - name: Reproduce historical scientific results
        run: python run_all.py
      - name: Reproduce submission analyses
        run: python submission-extension/run_all.py
      - name: Validate new analytical exhibits
        run: python submission-extension/verify_outputs.py
